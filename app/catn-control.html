<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catn Control</title>
<link rel="icon" href="cat.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09090b; --side: #0c0c0f; --panel: #141418; --el: #1a1a1f; --hover: #22222a; --stroke: #26262d; --stroke2: #33333c;
  --text: #ededf0; --sub: #9a9aa6; --muted: #63636e;
  --accent: #eaa06c; --accent-ink: #26140a; --accent-soft: rgba(234,160,108,.14);
  --ok: #4ade80; --ok-soft: rgba(74,222,128,.13); --bad: #f87171; --bad-soft: rgba(248,113,113,.13); --warn: #fbbf24;
  --r: 12px; --r-sm: 8px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 Inter, system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
.mono { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-size: 12px; }
.muted { color: var(--sub); }
.dim { color: var(--muted); }

/* shell */
.app { display: grid; grid-template-columns: 248px 1fr; height: 100vh; }
.side { background: var(--side); border-right: 1px solid var(--stroke); display: flex; flex-direction: column; min-height: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; }
img[src="cat.png"] { image-rendering: pixelated; }
a.btn { text-decoration: none; }
.brand img { width: 34px; height: 34px; filter: drop-shadow(0 2px 8px rgba(234,160,108,.35)); }
.brand b { font-size: 15px; letter-spacing: -.01em; display: block; }
.brand span { font-size: 11px; color: var(--muted); }
.nav { padding: 6px 10px; display: grid; gap: 2px; }
.nav button, .acct-link { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: var(--r-sm); background: none; color: var(--sub); text-align: left; }
.nav button:hover, .acct-link:hover { background: var(--hover); color: var(--text); }
.nav button.on, .acct-link.on { background: var(--el); color: var(--text); box-shadow: inset 0 0 0 1px var(--stroke); }
.nav svg { width: 16px; height: 16px; flex: none; }
.side h6 { margin: 18px 20px 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.accts { overflow: auto; padding: 0 10px 10px; flex: 1; display: grid; gap: 1px; align-content: start; }
.acct-link { font-size: 13px; }
.acct-link .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.side-foot { border-top: 1px solid var(--stroke); padding: 12px 16px; font-size: 12px; display: grid; gap: 8px; }
.conn { display: flex; align-items: center; gap: 8px; color: var(--sub); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--sub); text-decoration: underline; text-underline-offset: 2px; }
.linkbtn:hover { color: var(--text); }

.main { overflow: auto; min-width: 0; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 28px 32px 60px; }
.head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.head h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; font-weight: 700; }
.head p { margin: 4px 0 0; color: var(--sub); }
.head .grow { flex: 1; min-width: 200px; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: var(--r-sm); border: 1px solid var(--stroke2); background: var(--el); color: var(--text); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: none; border-color: transparent; color: var(--sub); }
.btn.ghost:hover { background: var(--hover); color: var(--text); }
.btn.danger { color: var(--bad); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 14px; height: 14px; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
.stat { background: var(--panel); border: 1px solid var(--stroke); border-radius: var(--r); padding: 14px 16px; }
.stat small { color: var(--sub); font-size: 12px; }
.stat b { display: block; font-size: 24px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }

/* account cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--stroke); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; position: relative; transition: border-color .15s; }
.card:hover { border-color: var(--stroke2); }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.card-top { display: flex; align-items: flex-start; gap: 10px; }
.card-top .who { flex: 1; min-width: 0; }
.card-top .who b { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-top .who span { font-size: 12px; color: var(--sub); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* roblox avatars */
.av { position: relative; flex: none; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: linear-gradient(140deg, var(--accent-soft), var(--el)); color: var(--accent); font-weight: 700; border: 1px solid var(--stroke2); line-height: 1; }
.av::before { content: attr(data-ltr); }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.av.lg { width: 44px; height: 44px; font-size: 18px; }
.av.sm { width: 24px; height: 24px; font-size: 11px; }
.av.on { border-color: var(--ok); box-shadow: 0 0 0 2px var(--ok-soft); }
.check { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--stroke2); background: none; display: grid; place-items: center; padding: 0; flex: none; margin-top: 2px; }
.check.on { background: var(--accent); border-color: var(--accent); }
.check.on::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--accent-ink); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--el); color: var(--sub); border: 1px solid var(--stroke); white-space: nowrap; }
.pill.on { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.pill.acc { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.status-line { font-size: 13px; color: var(--text); background: var(--el); border: 1px solid var(--stroke); border-radius: var(--r-sm); padding: 8px 10px; display: flex; gap: 8px; align-items: flex-start; }
.status-line::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: 7px; flex: none; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kv div small { display: block; font-size: 11px; color: var(--muted); }
.kv div b { font-variant-numeric: tabular-nums; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.card-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.pins { display: grid; gap: 6px; }
.pins .row { padding: 6px 0; border-top: 1px solid var(--stroke); }
.pins input[type=range] { width: 90px; }
.pins .num { width: 52px; }

.bulk { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(10px); border: 1px solid var(--accent); border-radius: var(--r); padding: 10px 14px; margin-bottom: 16px; }
.bulk b { flex: 1; }

/* account view */
.seg { display: inline-flex; background: var(--el); border: 1px solid var(--stroke); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; color: var(--sub); padding: 6px 12px; border-radius: 7px; font-size: 13px; font-weight: 500; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--hover); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.4); }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 16px; }
.search { flex: 1; min-width: 200px; height: 34px; border-radius: var(--r-sm); border: 1px solid var(--stroke2); background: var(--el); padding: 0 12px; outline: none; }
.search:focus, .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.also { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--sub); margin-bottom: 16px; }
.also button { border: 1px solid var(--stroke2); background: none; color: var(--sub); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
.also button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.sections { columns: 2 440px; column-gap: 14px; }
.section { break-inside: avoid; background: var(--panel); border: 1px solid var(--stroke); border-radius: var(--r); margin: 0 0 14px; overflow: hidden; }
.section h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--sub); padding: 12px 16px 6px; }
.row { display: flex; align-items: center; gap: 12px; padding: 9px 16px; min-height: 46px; }
.row + .row { border-top: 1px solid var(--stroke); }
.row .lbl { flex: 1; min-width: 0; }
.row .lbl b { font-weight: 500; display: block; }
.row .lbl small { display: block; color: var(--muted); font-size: 12px; line-height: 1.35; margin-top: 1px; }
.row.text { color: var(--sub); font-size: 13px; }
.row.text b { color: var(--text); font-weight: 500; }
.ctl { display: flex; align-items: center; gap: 8px; flex: none; }
.pin { border: 0; background: none; padding: 4px; color: var(--muted); border-radius: 6px; opacity: 0; transition: opacity .12s; }
.row:hover .pin, .pin.on { opacity: 1; }
.pin.on { color: var(--accent); }
.pin svg { width: 14px; height: 14px; display: block; }
.st { width: 16px; height: 16px; flex: none; display: grid; place-items: center; }
.st.pending::after { content: ""; width: 11px; height: 11px; border: 2px solid var(--stroke2); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
.st.ok { color: var(--ok); }
.st.fail { color: var(--bad); }
.st svg { width: 14px; height: 14px; }
.btn.busy svg { animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* controls */
.sw { width: 38px; height: 22px; border-radius: 999px; border: 0; background: var(--stroke2); position: relative; padding: 0; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.sw.on { background: var(--accent); }
.sw.on::after { transform: translateX(16px); }
.field { height: 30px; border-radius: 7px; border: 1px solid var(--stroke2); background: var(--el); padding: 0 10px; outline: none; max-width: 220px; }
select.field { padding-right: 28px; }
input[type=range] { width: 150px; accent-color: var(--accent); }
.num { width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
input[type=color] { width: 34px; height: 28px; padding: 0; border: 1px solid var(--stroke2); border-radius: 7px; background: none; }
.opt-chips { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; max-width: 300px; }
.opt-chips button { border: 1px solid var(--stroke2); background: none; color: var(--sub); border-radius: 999px; padding: 2px 9px; font-size: 12px; }
.opt-chips button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.key { min-width: 64px; justify-content: center; }
.key.listen { border-color: var(--accent); color: var(--accent); }

/* boards */
.boards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td { padding: 6px 16px; border-top: 1px solid var(--stroke); }
td:first-child { width: 44px; color: var(--muted); font-variant-numeric: tabular-nums; }
td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
tr.mine td { background: var(--accent-soft); color: var(--accent); }

/* empty, sign-in */
.empty { text-align: center; padding: 70px 20px; color: var(--sub); }
.empty img { width: 72px; opacity: .9; }
.empty h2 { color: var(--text); margin: 14px 0 6px; font-size: 18px; }
.empty p { max-width: 460px; margin: 0 auto 6px; }
.login { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(1200px 600px at 50% -10%, rgba(234,160,108,.12), transparent 60%), var(--bg); z-index: 20; padding: 16px; }
.login form { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--stroke); border-radius: 16px; padding: 28px; display: grid; gap: 14px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.login img { width: 56px; margin: 0 auto; }
.login h1 { margin: 0; text-align: center; font-size: 20px; }
.login p { margin: -6px 0 4px; text-align: center; color: var(--sub); font-size: 13px; }
.login label { display: grid; gap: 6px; font-size: 12px; color: var(--sub); font-weight: 500; }
.login .field { max-width: none; height: 38px; }
.login .btn { height: 40px; justify-content: center; }
.err { color: var(--bad); font-size: 13px; min-height: 18px; text-align: center; }

/* toasts */
.toasts { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 8px; z-index: 30; width: min(360px, calc(100vw - 36px)); }
.toast { background: var(--panel); border: 1px solid var(--stroke2); border-left: 3px solid var(--bad); border-radius: 10px; padding: 10px 14px; font-size: 13px; box-shadow: 0 12px 40px rgba(0,0,0,.5); animation: rise .2s ease-out; }
.toast.ok { border-left-color: var(--ok); }
.toast b { display: block; font-weight: 600; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }

/* desktop app: the window has no system title bar, so the top strip drags the window */
.drag { display: none; }
html.desk .drag { display: block; position: fixed; top: 0; left: 0; right: 140px; height: 36px; -webkit-app-region: drag; z-index: 15; }
html.desk .brand { padding-top: 34px; }
html.desk .wrap { padding-top: 48px; }
html.desk .login { padding-top: 40px; }
html.desk .login::before { content: ""; position: fixed; top: 0; left: 0; right: 140px; height: 36px; -webkit-app-region: drag; }

.alert { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--bad-soft); border: 1px solid var(--bad); border-radius: var(--r); padding: 10px 14px; margin-bottom: 16px; }
.alert b { color: var(--bad); white-space: nowrap; }
.alert span { color: var(--sub); font-size: 13px; flex: 1; min-width: 120px; }
.fleetbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--stroke); border-radius: var(--r); padding: 8px 8px 8px 14px; margin-bottom: 16px; }
.fleetbar b { font-size: 13px; }
.fleetbar .grow { flex: 1; }
.home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.feedwrap { position: sticky; top: 0; background: var(--panel); border: 1px solid var(--stroke); border-radius: var(--r); overflow: hidden; }
.feedhdr { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--sub); padding: 12px 16px; border-bottom: 1px solid var(--stroke); }
.feed { max-height: calc(100vh - 160px); overflow: auto; }
.fe { display: flex; align-items: flex-start; gap: 10px; padding: 9px 14px; font-size: 13px; }
.fe + .fe { border-top: 1px solid var(--stroke); }
.fe-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex: none; background: var(--muted); }
.fe.win .fe-dot, .fe.on .fe-dot, .fe.start .fe-dot { background: var(--ok); }
.fe.off .fe-dot, .fe.stop .fe-dot { background: var(--bad); }
.fe.cmd .fe-dot { background: var(--accent); }
.fe-txt { flex: 1; color: var(--sub); }
.fe-txt b { color: var(--text); font-weight: 500; }
.fe-t { color: var(--muted); font-size: 11px; white-space: nowrap; margin-top: 1px; }

.pal-wrap { position: fixed; inset: 0; background: rgba(0,0,0,.5); backdrop-filter: blur(3px); z-index: 40; display: grid; place-items: start center; padding-top: 12vh; }
.pal { width: min(560px, 92vw); background: var(--panel); border: 1px solid var(--stroke2); border-radius: 14px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.pal input { width: 100%; border: 0; border-bottom: 1px solid var(--stroke); background: none; color: var(--text); padding: 16px 18px; font-size: 16px; outline: none; }
.pal-list { max-height: 50vh; overflow: auto; padding: 6px; }
.pal-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; font-size: 14px; color: var(--sub); }
.pal-item.on { background: var(--hover); color: var(--text); }
.pal-item b { color: var(--text); font-weight: 500; }
.pal-item .k { margin-left: auto; font-size: 11px; color: var(--muted); border: 1px solid var(--stroke2); border-radius: 5px; padding: 1px 6px; }
.lb-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--stroke); }
.lb-row:first-child { border-top: 0; }
.lb-rank { width: 28px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }
.lb-row.top .lb-rank { color: var(--accent); }
.lb-nm { font-weight: 500; }
.lb-v { font-variant-numeric: tabular-nums; color: var(--text); }
.lb-bar { height: 4px; background: var(--accent); border-radius: 2px; margin-top: 5px; opacity: .8; }
.tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; font-size: 12px; }
.tag { display: inline-flex; align-items: center; gap: 5px; background: var(--el); border: 1px solid var(--stroke2); border-radius: 999px; padding: 3px 10px; color: var(--sub); }
.tag.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.tag .x { cursor: pointer; opacity: .6; }
.tag .x:hover { opacity: 1; }
.tag-add { width: 84px; background: none; border: 1px dashed var(--stroke2); border-radius: 999px; padding: 3px 10px; color: var(--sub); outline: none; }
.swatches { display: flex; gap: 6px; }
.sw-t { width: 18px; height: 18px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.sw-t.on { border-color: var(--text); }
/* stats: charts, sparklines, bars, count-ups */
.panel { background: var(--panel); border: 1px solid var(--stroke); border-radius: var(--r); padding: 16px 16px 14px; margin-bottom: 16px; }
.panel-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.panel-h h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--sub); flex: 1; }
.panel-h .big { font-size: 13px; color: var(--sub); }
.panel-h .big b { color: var(--text); font-variant-numeric: tabular-nums; }
.chart { display: grid; grid-template-columns: 40px minmax(0, 1fr); grid-template-rows: var(--h) auto; column-gap: 10px; user-select: none; }
.ch-y { position: relative; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ch-y span { position: absolute; right: 0; transform: translateY(-50%); }
.ch-plot { position: relative; cursor: crosshair; }
.ch-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ch-grid { stroke: var(--stroke); stroke-width: 1; }
.ch-area { fill: var(--accent); opacity: .12; }
.ch-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ch-dot { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--panel); }
.ch-dot::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; animation: ping 2.4s ease-out infinite; }
@keyframes ping { 0% { transform: scale(.4); opacity: .7; } 80%, 100% { transform: scale(1.4); opacity: 0; } }
.ch-x { grid-column: 2; display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); padding-top: 6px; }
.ch-cross { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--stroke2); display: none; pointer-events: none; }
.ch-cross::after { content: ""; position: absolute; left: -5px; top: var(--y, 0); width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--panel); }
.ch-tip { position: absolute; top: -8px; transform: translate(-50%, -100%); background: var(--el); border: 1px solid var(--stroke2); border-radius: 8px; padding: 5px 9px; font-size: 12px; white-space: nowrap; display: none; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.4); z-index: 2; }
.ch-tip b { font-variant-numeric: tabular-nums; }
.chart.hov .ch-cross, .chart.hov .ch-tip { display: block; }
.chart.anim svg { animation: reveal 1.1s cubic-bezier(.3,.7,.2,1) both; }
.chart.anim .ch-dot { animation: fadein .35s 1s both; }
@keyframes reveal { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes fadein { from { opacity: 0; transform: scale(.4); } }
.chart-empty { height: var(--h); display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 13px; border: 1px dashed var(--stroke2); border-radius: var(--r-sm); padding: 0 24px; }
.spark { width: 100%; height: 28px; display: block; overflow: visible; }
.spark .l { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linejoin: round; }
.spark .a { fill: var(--accent); opacity: .12; }
.spark-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--sub); }
.spark-row .spark { flex: 1; min-width: 0; }
.spark-row b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.stat .spark { margin-top: 8px; }
.stat b.stat-name { font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 6px; }
.stat.bump { animation: bump 1s ease-out; }
@keyframes bump { 0% { border-color: var(--accent); box-shadow: 0 0 0 0 var(--accent-soft); } 100% { box-shadow: 0 0 0 12px transparent; } }
.bars { display: grid; gap: 11px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 160px) minmax(0, 1fr) auto; align-items: center; gap: 10px; font-size: 13px; }
.bar-lbl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.bar-lbl span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { height: 10px; width: var(--w); min-width: 3px; border-radius: 0 4px 4px 0; background: var(--accent); transform-origin: left; }
.bars.anim .bar { animation: grow .9s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 45ms); }
@keyframes grow { from { transform: scaleX(0); } }
.bar-v { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; min-width: 36px; }
.stats-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 0 16px; }
.view-in { animation: viewin .28s ease-out; }
@keyframes viewin { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 860px) {
  .home-grid { grid-template-columns: 1fr; } .feedwrap { position: static; }
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .wrap { padding: 20px 16px 50px; }
}
</style>
</head>
<body>
<script>if (/Electron/.test(navigator.userAgent)) document.documentElement.classList.add("desk");</script>
<div class="drag"></div>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="cat.png" alt=""><div><b>Catn Control</b><span>every script, one window</span></div></div>
    <nav class="nav" id="nav"></nav>
    <h6>Accounts</h6>
    <div class="accts" id="accts"></div>
    <div class="side-foot" id="foot"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toasts" id="toasts"></div>
<div id="login"></div>
<div id="palette"></div>

<script src="core.js"></script>
<script>
"use strict";
const C = window.CatnCore;
const DB = "https://catn-db-default-rtdb.firebaseio.com/";
// public project key: it only names the project; the DB rules and your password do the protecting
const API_KEY = "AIzaSyAziLliiJqmMbi8okNuTwB4l_D8V6-8SRc";
const DEMO = new URLSearchParams(location.search).has("demo");
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const path = (...parts) => parts.map((p) => encodeURIComponent(p)).join("/");
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const ICON = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5M5 17h14l-2-3V5a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v9z"/></svg>',
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>',
  sync: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-5 3 3 6-7"/></svg>',
  medal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>',
  hop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  join: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg>',
};

// ---------- state ----------
const store = { accounts: {}, menus: {}, acks: {}, boards: null };
const orders = new Map(); // order id -> {acct, op, window, id, kind, value, t, state, msg, doneAt}
const ui = { view: "home", acct: null, win: null, tab: null, q: "", sel: new Set(), also: new Set(), listen: null, filter: null, lbMetric: "w", stMetric: null, stRange: "6h", acRange: "6h" };
let pins = lsGet("catn.pins", {}); // acct key -> ["window\u0001id", ...]
let tags = lsGet("catn.tags", {});     // acct key -> [tag, ...]
let scenes = lsGet("catn.scenes", {}); // window key -> { name: [{id,kind,value}, ...] }
let notifyOn = lsGet("catn.notify", false);
let themeName = lsGet("catn.theme", "Tabby");
let auth = lsGet("catn.auth", null); // {apiKey, refresh, uid, email}
let idToken = null, idExp = 0, conn = "connecting";

// ---------- auth ----------
async function signIn(apiKey, email, password) {
  const r = await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + encodeURIComponent(apiKey), {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email, password, returnSecureToken: true }),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(({ INVALID_LOGIN_CREDENTIALS: "Wrong email or password.", INVALID_PASSWORD: "Wrong email or password.", EMAIL_NOT_FOUND: "No login with that email.",
    TOO_MANY_ATTEMPTS_TRY_LATER: "Too many tries, wait a minute." })[j.error && j.error.message] ||
    (/API key/i.test(j.error && j.error.message || "") ? "That Web API key isn't right." : "Couldn't sign in: " + (j.error && j.error.message || r.status)));
  auth = { apiKey, refresh: j.refreshToken, uid: j.localId, email: j.email };
  idToken = j.idToken; idExp = Date.now() + Number(j.expiresIn || 3600) * 1000;
  lsSet("catn.auth", auth);
}
async function token() {
  if (DEMO) return "demo";
  if (idToken && Date.now() < idExp - 300000) return idToken;
  if (!auth) throw new Error("signed out");
  const r = await fetch("https://securetoken.googleapis.com/v1/token?key=" + encodeURIComponent(auth.apiKey || API_KEY), {
    method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(auth.refresh),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { signOut(); throw new Error("Your sign-in ran out. Sign in again."); }
  idToken = j.id_token; idExp = Date.now() + Number(j.expires_in || 3600) * 1000;
  if (j.refresh_token && j.refresh_token !== auth.refresh) { auth.refresh = j.refresh_token; lsSet("catn.auth", auth); }
  return idToken;
}
function signOut() { auth = null; idToken = null; try { localStorage.removeItem("catn.auth"); } catch {} renderLogin(); }

// ---------- live data ----------
const streams = [];
function stream(dbPath, key) {
  const es = new EventSource(DB + dbPath + ".json");
  const on = (kind) => (e) => {
    try { const m = JSON.parse(e.data); store[key] = C.applyEvent(store[key], m.path, m.data, kind); conn = "live"; schedule(); } catch {}
  };
  es.addEventListener("put", on("put"));
  es.addEventListener("patch", on("patch"));
  es.onopen = () => { conn = "live"; schedule(); };
  es.onerror = () => { conn = "reconnecting"; schedule(); };
  streams.push({ es, dbPath, key });
}

// manual refresh: pull a fresh snapshot of every path now, then reopen the live streams
let refreshing = false;
async function refresh() {
  if (refreshing || DEMO) return;
  refreshing = true; schedule();
  try {
    await Promise.all(streams.map(async (s) => {
      const r = await fetch(DB + s.dbPath + ".json");
      if (r.ok) { const d = await r.json(); store[s.key] = d == null ? (s.key === "boards" ? null : {}) : d; }
    }));
    conn = "live";
  } catch {}
  for (const s of streams) { try { s.es.close(); } catch {} }
  const paths = streams.map((s) => [s.dbPath, s.key]);
  streams.length = 0;
  for (const [dp, k] of paths) stream(dp, k);
  refreshing = false; schedule();
}

// ---------- orders ----------
async function send(acct, o) {
  const id = C.newOrderId(Date.now());
  const ord = { acct, op: o.op, window: o.window || "", id: o.id || "", kind: o.kind || "", value: o.value, t: Date.now(), state: "pending" };
  orders.set(id, ord);
  schedule();
  if (DEMO) return demoAnswer(id, ord);
  try {
    const tok = await token();
    const body = { op: ord.op, window: ord.window, id: ord.id, t: ord.t };
    if (ord.value !== undefined) body.value = ord.value;
    const r = await fetch(DB + path("orders", acct, id) + ".json?auth=" + encodeURIComponent(tok), { method: "PUT", body: JSON.stringify(body) });
    if (!r.ok) finish(id, "fail", r.status === 401 ? "not allowed: sign in with your own login" : "couldn't send (" + r.status + ")");
  } catch (e) { finish(id, "fail", e.message || "couldn't send"); }
}
function sendMany(accts, o) { for (const a of accts) send(a, o); }
function finish(id, state, msg) {
  const o = orders.get(id);
  if (!o || o.state !== "pending") return;
  o.state = state; o.msg = msg; o.doneAt = Date.now();
  const _nm = o.op === "set" || o.op === "press" ? ctlName(o) : o.op;
  if (state === "ok") pushFeed("cmd", o.acct, o.op === "rejoin" ? "rejoined on command" : o.op === "hop" ? "hopped on command" : "set " + _nm + " (you)");
  else pushFeed("cmd", o.acct, "your change to " + _nm + " failed");
  if (state === "fail") toast(shown(o.acct) + ": " + (o.op === "set" || o.op === "press" ? "“" + ctlName(o) + "” " : o.op + " ") + "didn't work", msg);
  else if (o.op === "rejoin" || o.op === "hop") toast(shown(o.acct) + (o.op === "hop" ? " is hopping servers" : " is rejoining"), null, true);
  if (!DEMO) cleanup(id, o);
  schedule();
}
async function cleanup(id, o) {
  try { const tok = await token(); await fetch(DB + path("orders", o.acct, id) + ".json?auth=" + encodeURIComponent(tok), { method: "DELETE" }); } catch {}
  try { await fetch(DB + path("acks", o.acct, id) + ".json", { method: "DELETE" }); } catch {}
}
setInterval(() => {
  const now = Date.now();
  for (const [id, o] of orders) {
    if (o.state === "pending") {
      const ack = (store.acks[o.acct] || {})[id];
      const res = C.orderOutcome(o, ack, now);
      if (res.state !== "pending") finish(id, res.state, res.msg);
    } else if (now - o.doneAt > 2500) { orders.delete(id); schedule(); }
  }
}, 500);
function stateOf(acct, win, id) {
  let last = null;
  for (const o of orders.values()) if (o.acct === acct && o.window === win && o.id === id && (!last || o.t > last.t)) last = o;
  return last;
}

// ---------- helpers over the data ----------
const nowSec = () => Date.now() / 1000;
function acctOf(key) {
  const a = store.accounts || {};
  if (a[key]) return a[key];
  for (const v of Object.values(a)) if (v && C.encodeKey(v.n) === key) return v;
  return null;
}
const shown = (key) => (acctOf(key) || {}).n || key;
function windowsOf(key) {
  const m = (store.menus || {})[key] || {};
  return Object.entries(m).filter(([, w]) => w && typeof w === "object").map(([k, w]) => ({ key: k, title: w.title || k, w, alive: C.windowAlive(w, Date.now()) }));
}
function linked() {
  return Object.keys(store.menus || {}).map((key) => {
    const a = acctOf(key), wins = windowsOf(key);
    return { key, a, wins, online: C.isOnline(a, nowSec()) || wins.some((w) => w.alive) };
  }).sort((x, y) => (y.online - x.online) || shown(x.key).localeCompare(shown(y.key)));
}
function ctlName(o) {
  const w = ((store.menus || {})[o.acct] || {})[o.window];
  const lay = w && w.layout ? (Array.isArray(w.layout) ? w.layout : Object.values(w.layout)) : [];
  const c = lay.find((x) => x && x.id === o.id);
  return c ? c.name : o.id;
}
const fmt = (n) => (Number(n) || 0).toLocaleString();
function ago(sec) {
  const d = Math.max(0, nowSec() - sec);
  return d < 60 ? "just now" : d < 3600 ? Math.floor(d / 60) + "m ago" : d < 86400 ? Math.floor(d / 3600) + "h ago" : Math.floor(d / 86400) + "d ago";
}
const joinUrl = (a) => a && a.pl ? "roblox://experiences/start?placeId=" + a.pl + (a.j ? "&gameInstanceId=" + a.j : "") : null;

// ---------- Roblox avatars: headshots by UserId, fetched once and cached ----------
const avatars = {}; // uid -> imageUrl ("" while pending or unavailable)
function avatarHTML(key, a, cls, online) {
  const uid = a && a.uid, url = uid && avatars[uid];
  const ltr = esc((String((a && a.n) || key).trim()[0] || "?").toUpperCase());
  return `<span class="av ${cls}${online ? " on" : ""}" data-ltr="${ltr}">${url ? `<img src="${esc(url)}" alt="" onerror="this.remove()">` : ""}</span>`;
}
function fetchAvatars() {
  const need = [...new Set(linked().map((l) => (l.a || {}).uid).filter((u) => u && avatars[u] === undefined))];
  if (!need.length) return;
  for (const u of need) avatars[u] = ""; // ask once, even if it comes back empty
  for (let i = 0; i < need.length; i += 100) {
    const ids = need.slice(i, i + 100);
    fetch(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${ids.join(",")}&size=150x150&format=Png&isCircular=true`)
      .then((r) => r.json()).then((d) => {
        let got = false;
        for (const x of (d && d.data) || []) if (x.state === "Completed" && x.imageUrl) { avatars[x.targetId] = x.imageUrl; got = true; }
        if (got) render();
      }).catch(() => {}); // CORS-blocked outside the desktop app: the monogram stays
  }
}

// ---------- stats history: one snapshot of every online account's progress a minute, 24 h kept ----------
const DAY = 864e5, RANGES = { "1h": 36e5, "6h": 216e5, "24h": DAY };
let hist = DEMO ? [] : lsGet("catn.hist", []);
function sampleHist() {
  const now = Date.now();
  if (hist.length && now - hist[hist.length - 1].t < 60000) return;
  const d = {};
  for (const l of linked()) { if (!l.online) continue; const m = C.metricOf(l.a); if (m) d[l.key] = [m.m, m.v]; }
  if (!Object.keys(d).length) return;
  hist.push({ t: now, d });
  while (hist.length && now - hist[0].t > DAY) hist.shift();
  if (!DEMO) lsSet("catn.hist", hist);
}
const MLABEL = (m) => m.charAt(0).toUpperCase() + m.slice(1);
function metricsSeen() {
  const s = new Set();
  for (const l of linked()) { const m = C.metricOf(l.a); if (m) s.add(m.m); }
  for (const x of hist.slice(-5)) for (const k in x.d) s.add(x.d[k][0]);
  return [...s].sort((a, b) => (a === "wins" ? -1 : b === "wins" ? 1 : a.localeCompare(b)));
}
// the gained series, carried on to "now" so the line reaches the right edge
const toNow = (g, now) => (g.series.length ? g.series.concat({ t: now, v: g.total }) : []);
const hhmm = (t) => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const axisNum = (v) => (v >= 10000 ? new Intl.NumberFormat(undefined, { notation: "compact" }).format(v) : fmt(v));
function niceMax(v) {
  if (v <= 4) return 4;
  const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}

// area chart: 2px line, faint wash, live end dot, crosshair + tooltip; draws itself in the first time a key is shown
const chartData = {}, drawnKeys = new Set();
function chartHTML(id, pts, o) {
  const h = o.h || 200;
  if (pts.length < 2) return `<div class="chart-empty" style="--h:${h}px">${o.empty}</div>`;
  const W = 1000, t0 = pts[0].t, t1 = Math.max(pts[pts.length - 1].t, t0 + 1), top = niceMax(Math.max(...pts.map((p) => p.v)));
  const X = (t) => (t - t0) / (t1 - t0) * W, Y = (v) => h - v / top * h, last = pts[pts.length - 1];
  const d = pts.map((p, i) => (i ? "L" : "M") + X(p.t).toFixed(1) + "," + Y(p.v).toFixed(1)).join("");
  const ticks = [0, top / 2, top], anim = !drawnKeys.has(o.animKey);
  drawnKeys.add(o.animKey);
  chartData[id] = { pts, t0, t1, top, unit: o.unit };
  return `<div class="chart${anim ? " anim" : ""}" data-chart="${id}" style="--h:${h}px" role="img" aria-label="${esc(MLABEL(o.unit))} gained since ${hhmm(t0)}: ${fmt(last.v)}">
    <div class="ch-y">${ticks.map((v) => `<span style="top:${(1 - v / top) * 100}%">${axisNum(v)}</span>`).join("")}</div>
    <div class="ch-plot"><svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" aria-hidden="true">${ticks.map((v) => `<line class="ch-grid" x1="0" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" vector-effect="non-scaling-stroke"/>`).join("")}<path class="ch-area" d="${d}L${X(last.t).toFixed(1)},${h}L0,${h}Z"/><path class="ch-line" d="${d}" vector-effect="non-scaling-stroke"/></svg>
      <span class="ch-dot" style="left:${X(last.t) / W * 100}%;top:${Y(last.v) / h * 100}%"></span><div class="ch-cross"></div><div class="ch-tip"></div></div>
    <div class="ch-x"><span>${hhmm(t0)}</span><span>${hhmm((t0 + t1) / 2)}</span><span>now</span></div></div>`;
}
function sparkHTML(pts) {
  if (pts.length < 3) return "";
  const W = 100, H = 28, t0 = pts[0].t, t1 = Math.max(pts[pts.length - 1].t, t0 + 1), top = Math.max(1, ...pts.map((p) => p.v));
  const d = pts.map((p, i) => (i ? "L" : "M") + ((p.t - t0) / (t1 - t0) * W).toFixed(1) + "," + (H - 2 - p.v / top * (H - 4)).toFixed(1)).join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path class="a" d="${d}L${W},${H}L0,${H}Z"/><path class="l" d="${d}" vector-effect="non-scaling-stroke"/></svg>`;
}
// horizontal bars, value at the tip; they grow in the first time a key is shown
function barsHTML(rows, animKey) {
  const max = Math.max(1, ...rows.map((r) => r.v)), anim = !drawnKeys.has(animKey);
  drawnKeys.add(animKey);
  return `<div class="bars${anim ? " anim" : ""}">${rows.map((r, i) => `<div class="bar-row"><div class="bar-lbl">${r.label}</div><div><div class="bar" style="--w:${r.v / max * 100}%;--i:${i}"></div></div><b class="bar-v">${fmt(r.v)}</b></div>`).join("")}</div>`;
}

// numbers count up to their new value; a tile whose number rose gets a soft glow
const shownNum = {}, calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const numHTML = (id, v, dec) => `<b data-num="${esc(id)}" data-to="${v}"${dec ? ` data-dec="${dec}"` : ""}>${dec ? v.toFixed(dec) : fmt(v)}</b>`;
function animateNums(root) {
  for (const el of root.querySelectorAll("[data-num]")) {
    const id = el.dataset.num, to = Number(el.dataset.to) || 0, dec = +(el.dataset.dec || 0), seen = id in shownNum;
    const from = seen ? shownNum[id] : 0, f = (x) => (dec ? x.toFixed(dec) : fmt(Math.round(x)));
    shownNum[id] = to;
    if (from === to || calm) continue;
    if (seen && to > from) { const tile = el.closest(".stat"); if (tile) tile.classList.add("bump"); }
    const t0 = performance.now();

const feed = [];            // newest first
const snap = {};            // last seen per account, for diffing
const attention = new Map(); // key -> why it stalled
function pushFeed(kind, acct, text) {
  feed.unshift({ kind, acct, text, t: Date.now() });
  if (feed.length > 80) feed.length = 80;
}
function pulse() {
  const before = feed.length, att = attention.size;
  for (const l of linked()) {
    const key = l.key, a = l.a || {};
    const cur = { wins: Number(a.w) || 0, online: l.online, running: l.wins.some((w) => w.alive), game: a.pl || 0 };
    const p = snap[key];
    if (p) {
      const d = cur.wins - p.wins;
      if (d > 0 && Math.floor(cur.wins / 1000) > Math.floor(p.wins / 1000)) notifyUser(shown(key) + " passed " + fmt(Math.floor(cur.wins / 1000) * 1000) + " wins", "");
      if (d > 0) pushFeed('win', key, d > 1 ? 'won ' + d + ' rounds' : 'won a round');
      if (cur.online && !p.online) pushFeed('on', key, 'came online');
      if (!cur.online && p.online) pushFeed('off', key, 'went offline');
      if (cur.running && !p.running) pushFeed('start', key, 'started a script');
      if (!cur.running && p.running) {
        const why = cur.game !== p.game ? "it switched to another game" : !cur.online ? "the account went offline (disconnected or Roblox closed)" : "it stopped updating — likely crashed, was unloaded, or the round reset";
        pushFeed("stop", key, "script stopped — " + why);
        if (cur.online && cur.game === p.game) { attention.set(key, why); notifyUser(shown(key) + " stopped", why); }
      }
      if (cur.running || !cur.online) attention.delete(key);
    }
    snap[key] = cur;
  }
  fetchAvatars(); // no-op once every linked account's headshot is cached
  const n0 = hist.length;
  sampleHist(); // one snapshot a minute for the graphs
  if (hist.length !== n0) schedule();
  if (feed.length !== before || attention.size !== att) schedule();
}

  const now = Date.now(), g = C.gained(hist, "wins", now - 600000);

  return mins >= 1 ? g.total / mins : 0;
}

    <div class="stats-2">
      <div class="panel"><div class="panel-h"><h3>Top accounts · ${rg}</h3></div>
        ${top.length ? barsHTML(top.map(([k, v]) => ({ label: avatarHTML(k, acctOf(k), "sm", false) + `<span>${esc(shown(k))}</span>`, v })), "top" + ak) : `<div class="dim" style="font-size:13px">No account has gained ${esc(m)} in this window yet.</div>`}</div>
      <div class="panel"><div class="panel-h"><h3>Where your accounts are</h3></div>
        ${games.length ? barsHTML(games.map(([gn, v]) => ({ label: `<span>${esc(gn)}</span>`, v })), "games") : `<div class="dim" style="font-size:13px">No accounts online.</div>`}</div>
    </div></div>`;
}

      ${chartHTML("acct", toNow(g, now), { h: 150, unit: am.m, animKey: "acct|" + key + "|" + am.m + "|" + rg, empty: "Collecting data. This graph fills in as the app watches " + esc(shown(key)) + ", one point a minute." })}</div>`;
  }
  return `<div class="wrap">
    <div class="head">${avatarHTML(key, a, "lg", C.isOnline(a, nowSec()))}<div class="grow"><h1>${esc(shown(key))}</h1>
      <p>${esc(gameName(a))}${a.t ? " · seen " + ago(a.t) : ""} · ${cur.alive ? '<span style="color:var(--ok)">script running</span>' : '<span class="dim">script not running</span>'}${(a.w != null || a.p != null) ? ` · ${fmt(a.w)} wins · ${fmt(a.p)} pts · +${fmt(a.sw || 0)} this run` : ""}${(a.w == null && a.p == null && a.rn != null) ? ` · +${fmt(a.rn)}${a.rl ? " " + esc(a.rl) : ""} this run` : ""}</p></div>

function controlRow(acct, win, w, c, compact) {
  const v = (w.v || {})[c.id];
  const o = stateOf(acct, win, c.id);
  const val = o && o.state === "pending" && o.value !== undefined ? o.value : v;
  const d = `data-acct="${esc(acct)}" data-w="${esc(win)}" data-id="${esc(c.id)}" data-kind="${esc(c.kind)}"`;
  const st = o ? `<span class="st ${o.state}" title="${esc(o.msg || "")}">${o.state === "ok" ? ICON.ok : o.state === "fail" ? ICON.x : ""}</span>` : `<span class="st"></span>`;
  const pinned = (pins[acct] || []).includes(win + "\u0001" + c.id);
  const pin = compact ? "" : `<button class="pin ${pinned ? "on" : ""}" data-pin ${d} title="${pinned ? "Unpin from" : "Pin to"} the overview card">${ICON.pin}</button>`;
  const label = `<div class="lbl"><b>${esc(c.name)}</b>${c.desc && !compact ? `<small>${esc(c.desc)}</small>` : ""}</div>`;
  let ctl;
  switch (c.kind) {
    case "Label": case "Paragraph":
      if (val == null || val === "") return "";
      return `<div class="row text">${c.kind === "Paragraph" ? `<div class="lbl"><b>${esc(c.name)}</b><small>${esc(val)}</small></div>` : `<div class="lbl">${esc(val)}</div>`}</div>`;
    case "Progress": case "Divider": return "";
    case "Toggle": ctl = `<button class="sw ${val === true ? "on" : ""}" data-set ${d} aria-pressed="${val === true}" aria-label="${esc(c.name)}"></button>`; break;
    case "Slider": {
      const n = Number(val) || 0;
      ctl = `<input type="range" min="${esc(c.min ?? 0)}" max="${esc(c.max ?? 100)}" step="${esc(c.step || 1)}" value="${esc(n)}" data-set ${d} aria-label="${esc(c.name)}">` +
        `<input class="field num" type="number" min="${esc(c.min ?? "")}" max="${esc(c.max ?? "")}" step="${esc(c.step || 1)}" value="${esc(n)}" data-set ${d}>`;
      break;
    }
    case "Dropdown": {
      const opts = Array.isArray(c.options) ? c.options : Object.values(c.options || {});
      if (c.multi) {
        const on = new Set((Array.isArray(val) ? val : Object.values(val || {})).map(String));
        ctl = `<div class="opt-chips">${opts.map((x) => `<button class="${on.has(String(x)) ? "on" : ""}" data-multi="${esc(x)}" ${d}>${esc(x)}</button>`).join("")}</div>`;
      } else {
        const has = opts.map(String).includes(String(val));
        ctl = `<select class="field" data-set ${d} aria-label="${esc(c.name)}">${has ? "" : `<option selected>${esc(val ?? "—")}</option>`}${opts.map((x) => `<option ${String(x) === String(val) ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>`;
      }
      break;
    }
    case "Input": ctl = `<input class="field" value="${esc(val ?? "")}" data-set ${d} aria-label="${esc(c.name)}" placeholder="Type, then Enter">`; break;
    case "Keybind": {
      const listening = ui.listen && ui.listen.acct === acct && ui.listen.win === win && ui.listen.id === c.id;
      ctl = `<button class="btn sm key ${listening ? "listen" : ""}" data-key ${d}>${listening ? "Press a key…" : esc(val || "None")}</button>`; break;
    }
    case "ColorPicker": ctl = `<input type="color" value="${esc(/^#[0-9a-f]{6}$/i.test(val || "") ? val : "#ffffff")}" data-set ${d} aria-label="${esc(c.name)}">`; break;
    case "Button": ctl = `<button class="btn sm" data-press ${d}>Run</button>`; break;
    default: return "";
  }
  return `<div class="row">${label}<div class="ctl">${st}${ctl}${pin}</div></div>`;
}

// ---------- toasts ----------
function toast(title, msg, good) {

// ---------- input ----------
function targets(acct) { return [acct, ...[...ui.also].filter((k) => k !== acct && ui.view === "acct")]; }
function setFrom(el, value) {
  const { acct, w, id, kind } = el.dataset;

}
document.addEventListener("click", (e) => {
  if (hoverChart && !e.target.closest(".chart")) leaveCharts(); // a click elsewhere ends the hover pause
  const palHit = e.target.closest("[data-palrun]");
  if (palHit) { runPal(+palHit.dataset.palrun); return; }
  if (e.target.classList && e.target.classList.contains("pal-wrap")) { closePal(); return; }
  const t = e.target.closest("button, a");
  if (!t) return;
  const ds = t.dataset;
  if (ds.go) { ui.view = ds.go; ui.q = ""; schedule(); }
  else if (ds.open) { ui.view = "acct"; ui.acct = ds.open; ui.win = null; ui.tab = null; ui.q = ""; ui.also.clear(); $("#main").scrollTop = 0; schedule(); }
  else if (ds.win) { ui.win = ds.win; ui.tab = null; schedule(); }
  else if (ds.tab) { ui.tab = ds.tab; ui.q = ""; schedule(); }
  else if (ds.also) { ui.also.has(ds.also) ? ui.also.delete(ds.also) : ui.also.add(ds.also); schedule(); }
  else if (ds.sel) { ui.sel.has(ds.sel) ? ui.sel.delete(ds.sel) : ui.sel.add(ds.sel); schedule(); }
  else if (t.hasAttribute("data-selall")) { const L = linked(); if (ui.sel.size >= L.length) ui.sel.clear(); else L.forEach((l) => ui.sel.add(l.key)); schedule(); }
  else if (t.hasAttribute("data-clearsel")) { ui.sel.clear(); schedule(); }
  else if (t.hasAttribute("data-refresh")) refresh();
  else if (ds.bulk) { sendMany([...ui.sel], { op: ds.bulk }); }
  else if (ds.fleet) { const ks = linked().filter((l) => l.online).map((l) => l.key); if (ks.length && (ds.fleet === "rejoin" || confirm("Hop all " + ks.length + " online accounts to new servers?"))) sendMany(ks, { op: ds.fleet }); }
  else if (ds.rejoinkeys) sendMany(ds.rejoinkeys.split("\u0001"), { op: "rejoin" });
  else if (ds.lb) { ui.lbMetric = ds.lb; schedule(); }
  else if (ds.stm) { ui.stMetric = ds.stm; schedule(); }
  else if (ds.str) { ui.stRange = ds.str; schedule(); }
  else if (ds.acr) { ui.acRange = ds.acr; schedule(); }
  else if (t.hasAttribute("data-filter")) { ui.filter = ds.filter || null; schedule(); }
  else if (ds.untag) { const k = ui.acct; tags[k] = (tags[k] || []).filter((x) => x !== ds.untag); lsSet("catn.tags", tags); schedule(); }
  else if (ds.theme) { applyTheme(ds.theme); renderSide(); schedule(); }
  else if (t.hasAttribute("data-notify")) { if (!notifyOn && typeof Notification !== "undefined" && Notification.permission === "default") Notification.requestPermission(); notifyOn = !notifyOn; lsSet("catn.notify", notifyOn); renderSide(); }
  else if (t.hasAttribute("data-copyto")) { const ent = winValues(ui.acct, ui.win), tg = [...ui.also]; if (!tg.length) toast("Tick some accounts first", "Use \u201cAlso apply changes to\u201d above, then Copy."); else { tg.forEach((x) => applyValues(x, ui.win, ent)); toast("Copied " + ent.length + " settings to " + tg.length + " account(s)", null, true); } }
  else if (t.hasAttribute("data-savescene")) { const nm = (prompt("Name this scene:") || "").trim(); if (nm) { scenes[ui.win] = scenes[ui.win] || {}; scenes[ui.win][nm] = winValues(ui.acct, ui.win); lsSet("catn.scenes", scenes); toast("Saved scene \u201c" + nm + "\u201d", null, true); schedule(); } }
  else if (ds.op) { send(ds.acct, { op: ds.op }); }
  else if (t.hasAttribute("data-signout")) signOut();
  else if (t.hasAttribute("data-pin")) {
    const k = ds.w + "\u0001" + ds.id, list = pins[ds.acct] || (pins[ds.acct] = []);
    const i = list.indexOf(k); i >= 0 ? list.splice(i, 1) : list.push(k);
    lsSet("catn.pins", pins); schedule();
  }
  else if (t.hasAttribute("data-press")) sendMany(targets(ds.acct), { op: "press", window: ds.w, id: ds.id, kind: "Button" });
  else if (t.hasAttribute("data-key")) { ui.listen = { acct: ds.acct, win: ds.w, id: ds.id, el: ds }; schedule(); }
  else if (ds.multi !== undefined) {
    const w = ((store.menus || {})[ds.acct] || {})[ds.w] || {};
    const cur = new Set((Array.isArray((w.v || {})[ds.id]) ? w.v[ds.id] : Object.values((w.v || {})[ds.id] || {})).map(String));
    cur.has(ds.multi) ? cur.delete(ds.multi) : cur.add(ds.multi);
    setFrom(t, [...cur]);
  }
  else if (t.matches(".sw[data-set]")) setFrom(t, !t.classList.contains("on"));
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.hasAttribute("data-applyscene")) { const nm = el.value, sc = nm && (scenes[ui.win] || {})[nm]; if (sc) { applyValues(ui.acct, ui.win, sc); [...ui.also].forEach((x) => applyValues(x, ui.win, sc)); toast("Applied scene \u201c" + nm + "\u201d", null, true); } el.value = ""; return; }
  if (!el.matches("[data-set]")) return;
  if (el.type === "range" || el.type === "number") { const n = Number(el.value); if (Number.isFinite(n)) setFrom(el, n); }
  else if (el.tagName === "SELECT" || el.type === "color") setFrom(el, el.value);
  el.blur();
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "palq") { pal.q = el.value; pal.i = 0; renderPalette(); return; }
  if (el.id === "q") { ui.q = el.value; const pos = el.selectionStart; render(); const q = $("#q"); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }
  else if (el.type === "range") { const num = el.parentElement.querySelector(".num"); if (num) num.value = el.value; }
});
document.addEventListener("keydown", (e) => {
  if ((e.key === "k" || e.key === "K") && (e.ctrlKey || e.metaKey)) { e.preventDefault(); pal.open ? closePal() : openPal(); return; }
  if (pal.open) {
    const items = palItems();
    if (e.key === "Escape") { e.preventDefault(); closePal(); return; }
    if (e.key === "ArrowDown") { e.preventDefault(); pal.i = Math.min(items.length - 1, pal.i + 1); renderPalette(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); pal.i = Math.max(0, pal.i - 1); renderPalette(); return; }
    if (e.key === "Enter") { e.preventDefault(); runPal(pal.i); return; }
    return;
  }
  if (e.key === "Enter" && e.target.id === "tagadd") { const k = e.target.dataset.tagfor, v = e.target.value.trim(); if (v) { tags[k] = [...new Set([...(tags[k] || []), v])]; lsSet("catn.tags", tags); } e.target.value = ""; e.target.blur(); schedule(); return; }
  if (ui.listen) {
    e.preventDefault();
    const l = ui.listen; ui.listen = null;
    if (e.key !== "Escape") sendMany(targets(l.acct), { op: "set", window: l.win, id: l.id, kind: "Keybind", value: robloxKey(e) });
    schedule(); return;
  }
  const el = e.target;
  if (e.key === "Enter" && el.matches("input.field[data-set]:not(.num)")) { setFrom(el, el.value); el.blur(); }
  if (e.key === "/" && ui.view === "acct" && document.activeElement === document.body) { e.preventDefault(); const q = $("#q"); if (q) q.focus(); }
});
document.addEventListener("pointerdown", (e) => { if (e.target.type === "range") e.target.dataset.drag = "1"; });
document.addEventListener("pointerup", () => document.querySelectorAll("[data-drag]").forEach((el) => delete el.dataset.drag));

// browser key -> Roblox KeyCode name
function robloxKey(e) {
  const c = e.code, digits = ["Zero", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine"];
  if (/^Key[A-Z]$/.test(c)) return c.slice(3);
  if (/^Digit\d$/.test(c)) return digits[+c.slice(5)];
  if (/^Numpad\d$/.test(c)) return "Keypad" + digits[+c.slice(6)];
  if (/^F\d+$/.test(c)) return c;
  const map = { ShiftLeft: "LeftShift", ShiftRight: "RightShift", ControlLeft: "LeftControl", ControlRight: "RightControl", AltLeft: "LeftAlt", AltRight: "RightAlt",
    Space: "Space", Tab: "Tab", Enter: "Return", CapsLock: "CapsLock", ArrowUp: "Up", ArrowDown: "Down", ArrowLeft: "Left", ArrowRight: "Right",
    Insert: "Insert", Delete: "Delete", Home: "Home", End: "End", PageUp: "PageUp", PageDown: "PageDown", Backquote: "Backquote", Minus: "Minus",
    Equal: "Equals", BracketLeft: "LeftBracket", BracketRight: "RightBracket", Backslash: "BackSlash", Semicolon: "Semicolon", Quote: "Quote",
    Comma: "Comma", Period: "Period", Slash: "Slash" };
  return map[c] || e.key.toUpperCase();
}

// ---------- sign-in ----------
function renderLogin() {
  if (DEMO || auth) { $("#login").innerHTML = ""; return; }
  $("#login").innerHTML = `<div class="login"><form id="lf">
    <img src="cat.png" alt=""><h1>Catn Control</h1><p>Sign in with your Firebase login. Only it can send orders.</p>
    <label>Email<input class="field" name="email" type="email" required autocomplete="username"></label>
    <label>Password<input class="field" name="pw" type="password" required autocomplete="current-password"></label>
    <div class="err" id="lerr"></div>
    <button class="btn primary" type="submit">Sign in</button></form></div>`;
  $("#lf").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target, btn = f.querySelector("button");
    btn.disabled = true; btn.textContent = "Signing in…"; $("#lerr").textContent = "";
    try {
      await signIn(API_KEY, f.email.value.trim(), f.pw.value);
      renderLogin(); render();
    } catch (err) { $("#lerr").textContent = err.message; btn.disabled = false; btn.textContent = "Sign in"; }
  });
}

function demoAnswer(id, o) {

    const bad = o.op === "set" && o.kind === "Slider" && Number(o.value) > 9;
    store.acks = C.applyEvent(store.acks, "/" + o.acct + "/" + id, bad ? { ok: false, err: "out of range" } : { ok: true, value: o.value }, "put");
    if (!bad && o.op === "set") store.menus = C.applyEvent(store.menus, "/" + o.acct + "/" + o.window + "/v/" + o.id, o.value, "put");
    schedule();
  }, 600 + Math.random() * 500);
}

  // 24 h of minute snapshots so the graphs have something to draw

    hist.push({ t, d: { catnba: ["wins", w1], getcatnhb: ["wins", w2], tabbyfarm: ["kills", k] } });
  }
  store.accounts = {
    catnba: { n: "catnba", g: "Funky Friday", w: w1, sw: 38, p: 51244, t: s - 12, st: "in", pl: 6447798030, j: "x", rt: s - 3600, rw: 41 },

  };
  store.menus = {

  };
  store.boards = { t: s - 300, boards: { WeeklyWins: { title: "Weekly Wins", rows: [{ r: 1, n: "someone", v: "4,210" }, { r: 2, n: "catnba", v: "3,980" }, { r: 3, n: "getcatnhb", v: "3,911" }] }, WeeklyScore: { title: "Weekly Score", rows: [{ r: 1, n: "player9", v: "92M" }] } } };
  conn = "live";
}
